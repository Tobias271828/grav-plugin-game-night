# Bei einem Versions-Tag (z. B. 1.0.1): prüfen, beide Pakete bauen und als GitHub-Release veröffentlichen.
# Grav (GPM) erkennt neue Versionen an diesem Release.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: zip
          coverage: none

      - name: Version prüfen
        run: |
          VERSION="${GITHUB_REF_NAME}"
          grep -qxF "version: ${VERSION}" blueprints.yaml || { echo "blueprints.yaml hat nicht version: ${VERSION}"; exit 1; }
          grep -qxF "# v${VERSION}" CHANGELOG.md || { echo "CHANGELOG.md hat keinen Abschnitt # v${VERSION}"; exit 1; }

      - name: Syntax prüfen
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          for f in assets/js/*.js; do node --check "$f"; done

      - name: API-Tests
        run: php tests/api-test.php

      - name: Pakete bauen
        run: php build.php

      - name: Release-Text aus dem CHANGELOG
        run: awk -v v="# v${GITHUB_REF_NAME}" '$0 == v {on=1; next} /^# v/ {on=0} on' CHANGELOG.md > notes.md

      # Am Plugin-Release hängt nur das Grav-Paket: GPM installiert die letzte ZIP-Datei eines Releases
      - name: Grav-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/game-night-grav-${GITHUB_REF_NAME}.zip"
          # Wiederholter Lauf nach einem halben Release: Datei nur ersetzen
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ZIP" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$ZIP" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi

      # Standalone-Paket: Release gleicher Version im eigenen Repository (braucht das Secret STANDALONE_TOKEN)
      - name: Standalone-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.STANDALONE_TOKEN }}
          REPO: ${{ github.repository_owner }}/game-night-standalone
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Secret STANDALONE_TOKEN fehlt"; exit 1; fi
          ZIP="dist/game-night-standalone-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ZIP" --repo "$REPO" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$ZIP" --repo "$REPO" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
